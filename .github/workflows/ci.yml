name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test tvOS app
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: List project schemes
        run: xcodebuild -list -project "MoviePilot-TV.xcodeproj"

      - name: List available tvOS simulators
        run: xcrun simctl list devices tvOS available

      - name: Test scripts
        run: |
          bash -n scripts/apple-tv-renew.sh
          python3 -m unittest discover -s scripts/tests

      - name: Build and test on a disposable simulator
        run: python3 scripts/test-tvos.py
